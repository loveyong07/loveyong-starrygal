name: Publish Windows installer

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Run full cloud build and upgrade verification even if release already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: starrygal-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check whether release already exists
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.force_build }}" == "true" ]]; then
            echo "force_build=true; running full cloud build and verification."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          check_release() {
            gh api "repos/${{ github.repository }}/releases?per_page=30" \
              --jq ".[] | select(.tag_name == \"v$version\") | .tag_name"
          }
          existing=$(check_release)
          if [[ -z "$existing" && "${{ github.event_name }}" == "push" ]]; then
            sleep 8
            existing=$(check_release)
          fi
          if [[ -n "$existing" ]]; then
            echo "Release v$version already exists (published locally); skipping cloud build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$version does not exist yet; proceeding with cloud build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:release
      - run: pnpm check:ipc
      - run: pnpm test
      - run: cargo test --lib --bins --locked
        working-directory: src-tauri
      - name: Build Chinese installer with directory selection
        run: pnpm tauri build --bundles nsis --ci
      - name: Verify installation into a custom directory
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one installer' }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'StarryGal custom install'
          $setup = Start-Process -FilePath $installer[0].FullName -ArgumentList "/S /D=$installDirectory" -PassThru -Wait -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $application = Join-Path $installDirectory 'StarryGal.exe'
          if (-not (Test-Path -LiteralPath $application)) { throw 'Custom installation directory was not honored' }
          $process = Start-Process -FilePath $application -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "Installed application exited at startup: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
          Write-Output 'Custom-directory installation and application startup passed.'
      - name: Verify in-place upgrade preserves user data
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one installer' }
          ./scripts/verify-windows-upgrade.ps1 -InstallerPath $installer[0].FullName -InstallDirectory (Join-Path $env:RUNNER_TEMP 'StarryGal custom install')
      - name: Stage downloads and checksums
        id: downloads
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installers = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          Copy-Item -LiteralPath $installers[0].FullName -Destination "release-assets/StarryGal_${version}_windows_x64_setup.exe"
          Copy-Item -LiteralPath src-tauri/target/release/StarryGal.exe -Destination "release-assets/StarryGal_${version}_windows_x64_portable.exe"
          Get-ChildItem -LiteralPath release-assets -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath release-assets/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: StarryGal-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub download entry
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.downloads.outputs.version }}'
          $existing = gh api "repos/${{ github.repository }}/releases?per_page=30" --jq ".[] | select(.tag_name == `"v$version`") | .tag_name"
          if ($existing) {
            Write-Output "Release v$version already exists; keeping existing release intact."
            exit 0
          }
          gh release create "v$version" --draft --target '${{ github.sha }}' --title "StarryGal v$version" --notes-file RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases will not be overwritten automatically' }
          gh release upload "v$version" release-assets/*
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          gh release edit "v$version" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
