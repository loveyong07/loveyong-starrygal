name: Publish Windows installer

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starrygal-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:release
      - run: pnpm check:ipc
      - run: pnpm test
      - run: cargo test --lib --bins --locked
        working-directory: src-tauri
      - name: Build Chinese installer with directory selection
        run: pnpm tauri build --bundles nsis --ci
      - name: Verify installation into a custom directory
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one installer' }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'StarryGal custom install'
          $setup = Start-Process -FilePath $installer[0].FullName -ArgumentList "/S /D=$installDirectory" -PassThru -Wait -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $application = Join-Path $installDirectory 'StarryGal.exe'
          if (-not (Test-Path -LiteralPath $application)) { throw 'Custom installation directory was not honored' }
          $process = Start-Process -FilePath $application -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "Installed application exited at startup: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
          Write-Output 'Custom-directory installation and application startup passed.'
      - name: Stage downloads and checksums
        id: downloads
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installers = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          Copy-Item -LiteralPath $installers[0].FullName -Destination "release-assets/StarryGal_${version}_windows_x64_setup.exe"
          Copy-Item -LiteralPath src-tauri/target/release/StarryGal.exe -Destination "release-assets/StarryGal_${version}_windows_x64_portable.exe"
          Get-ChildItem -LiteralPath release-assets -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath release-assets/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: StarryGal-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub download entry
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.downloads.outputs.version }}'
          gh release create "v$version" --target '${{ github.sha }}' --title "StarryGal v$version" --notes-file RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases will not be overwritten automatically' }
          gh release upload "v$version" release-assets/*
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
